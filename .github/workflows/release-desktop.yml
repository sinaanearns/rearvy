name: Build & Release Desktop
# Trigger release for v0.1.2 - Workflow automation complete

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop-app/**'
      - 'scripts/desktop/**'
      - '.github/workflows/release-desktop.yml'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm run install:all

      - name: Remove outdated GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $keepTag = "v$version"
          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "rearvy-release-workflow"
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/mutalvita-cyber/rearvy2.0/releases?per_page=100"
          foreach ($release in @($releases)) {
            if ($release.tag_name -ne $keepTag) {
              Write-Host "Deleting outdated release $($release.tag_name)..."
              Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/mutalvita-cyber/rearvy2.0/releases/$($release.id)" | Out-Null
            }
          }

      - name: Build Windows installer
        run: npm run desktop:build:win

      - name: Create GitHub Release
        run: npm run release:upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release
          path: desktop-release/
          retention-days: 30
