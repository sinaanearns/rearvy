name: Build & Release Desktop
# Trigger release for v0.1.2 - 2026-05-23T03-24-23+05:30

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'desktop-app/**'
      - 'scripts/desktop/**'
      - '.github/workflows/release-desktop.yml'

jobs:
  build-and-release:
    runs-on: windows-2022
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: false
          lfs: false

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Install desktop dependencies
        working-directory: desktop-app
        run: npm ci

      - name: Remove outdated GitHub release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $keepTag = "v$version"
          $headers = @{
            Authorization = "token $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "User-Agent" = "rearvy-release-workflow"
          }
          $releases = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/mutalvita-cyber/rearvy2.0/releases?per_page=100"
          foreach ($release in @($releases)) {
            if ($release.tag_name -ne $keepTag) {
              Write-Host "Deleting outdated release $($release.tag_name)..."
              Invoke-RestMethod -Headers $headers -Method Delete -Uri "https://api.github.com/repos/mutalvita-cyber/rearvy2.0/releases/$($release.id)" | Out-Null
            }
          }

      - name: Build Windows installer
        run: npm run desktop:build:win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Create GitHub Release
        run: npm run release:upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-release
          path: desktop-release/
          retention-days: 30
