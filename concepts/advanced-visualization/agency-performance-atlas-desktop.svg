<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">Rearvy Agency Performance Atlas desktop concept</title>
  <desc id="desc">Large-screen concept for a connected-data agency visualization with client matrix, evidence lanes, timeline, and action review panel.</desc>
  <defs>
    <style>
      .bg { fill: #f2f2ee; }
