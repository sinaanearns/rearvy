      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #050505; }
      .h1 { font-size: 44px; font-weight: 900; letter-spacing: 0; }
      .h2 { font-size: 28px; font-weight: 900; letter-spacing: 0; }
      .h3 { font-size: 18px; font-weight: 900; letter-spacing: 0; }
      .small { font-size: 13px; font-weight: 700; letter-spacing: 0; }
      .tiny { font-size: 10px; font-weight: 800; letter-spacing: 0.08em; }
      .micro { font-size: 9px; font-weight: 800; letter-spacing: 0.04em; }
      .inverse { fill: #fffefa; }
      .value { font-size: 32px; font-weight: 950; letter-spacing: 0; }
      .shadow { filter: drop-shadow(6px 6px 0 #050505); }
      .dash { stroke-dasharray: 6 6; }
    </style>
