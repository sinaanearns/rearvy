      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #050505; }
      .h2 { font-size: 22px; font-weight: 950; letter-spacing: 0; }
      .small { font-size: 12px; font-weight: 750; letter-spacing: 0; }
      .tiny { font-size: 9px; font-weight: 850; letter-spacing: 0.08em; }
      .micro { font-size: 8px; font-weight: 850; letter-spacing: 0.04em; }
      .inverse { fill: #fffefa; }
      .thin { stroke: #050505; stroke-width: 1; fill: none; }
      .line { stroke: #050505; stroke-width: 2; fill: none; }
      .shadow { filter: drop-shadow(4px 4px 0 #050505); }
