<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clicky</title>
    <link rel="stylesheet" href="./renderer.css" />
    <style>
      html,
      body {
        background: transparent;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 10px;
      }
      .clicky-shell {
        width: 100%;
        height: 100%;
        border-radius: 22px;
        border: 1px solid rgba(255, 255, 255, 0.14);
        background: rgba(8, 12, 18, 0.72);
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(18px);
        display: grid;
        place-items: center;
        color: #f2f5f8;
        text-align: center;
        padding: 14px;
      }
      .clicky-title {
        font-size: 11px;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.48);
      }
      .clicky-status {
        margin-top: 8px;
        font-weight: 700;
        font-size: 18px;
      }
      .clicky-subtitle {
        margin-top: 6px;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.62);
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <div class="clicky-shell">
      <div>
        <div class="clicky-title">Clicky</div>
        <div class="clicky-status" id="clicky-status">Booting…</div>
        <div class="clicky-subtitle" id="clicky-subtitle">Native overlay for mouse assistance</div>
      </div>
    </div>
    <script type="module" src="./clicky.mjs"></script>
  </body>
</html>
