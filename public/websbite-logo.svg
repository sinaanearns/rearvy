    <path d="M505 280C495 390 615 470 700 500" stroke="url(#arcA)" stroke-width="5" stroke-linecap="round"/>
    <path d="M710 500C725 595 790 725 875 800" stroke="url(#arcB)" stroke-width="5" stroke-linecap="round"/>
