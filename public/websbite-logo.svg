  <path d="M505 280C495 390 615 470 700 500" stroke="#9FE9FF" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M710 500C725 595 790 725 875 800" stroke="#9FE9FF" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="280" y1="500" x2="1115" y2="500" stroke="#88D8FF" stroke-width="1.1"/>

  <circle cx="700" cy="500" r="80" fill="url(#core)"/>
