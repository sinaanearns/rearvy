      <stop offset="0.45" stop-color="#9FE9FF"/>
      <stop offset="1" stop-color="#3D7DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ray" x1="280" y1="500" x2="1115" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EA9FF" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#A8EBFF"/>
      <stop offset="0.52" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#4A8DFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arcA" x1="490" y1="280" x2="705" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#70B9FF" stop-opacity="0"/>
      <stop offset="1" stop-color="#BDF4FF"/>
    </linearGradient>
    <linearGradient id="arcB" x1="710" y1="500" x2="880" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDF4FF"/>
      <stop offset="1" stop-color="#4F91FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stream" x1="995" y1="500" x2="1480" y2="250" gradientUnits="userSpaceOnUse">
